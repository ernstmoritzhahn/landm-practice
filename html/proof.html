<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Induction Proofs | University of Twente</title>
    <style>
        :root {
            --ut-red: #f1131e;
            --ut-black: #000000;
            --ut-dark-grey: #333333;
            --border-color: #e6e6e6;
            --bg-light: #ffffff;
            --ok: #0a7a30;
            --warn: #b26a00;
            --fail: #c02020;
        }

        body {
            font-family: "Arial", sans-serif;
            background-color: var(--bg-light);
            color: var(--ut-black);
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 1.2rem 10% 0.8rem 10%;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { font-size: 1.6rem; font-weight: 400; margin: 0; }

        main {
            padding: 2rem 10% 3rem 10%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--ut-black);
            display: inline-block;
        }

        /* exercise group tabs */
        #tabs { margin-bottom: 0; }
        #tabs .tab, #subtabs .subtab, #variant .vartab {
            background: #fff;
            color: var(--ut-black);
            border: 1px solid var(--border-color);
            border-bottom: none;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: normal;
            margin-right: 2px;
        }
        #tabs .tab.active {
            background: var(--ut-black); color: #fff; font-weight: bold;
        }
        #subtabs { margin-bottom: 1.2rem; border-bottom: 2px solid var(--ut-black); padding-bottom: 0; }
        #subtabs .subtab {
            font-family: "Monaco", "Consolas", monospace;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-bottom: none;
            margin-bottom: -2px;
        }
        #subtabs .subtab.active {
            border-bottom: 2px solid var(--ut-red);
            font-weight: bold;
            color: var(--ut-red);
        }
        #variant { margin: 0.6rem 0 1.4rem 0; }
        #variant .varlabel { font-size: 0.85rem; color: #666; margin-right: 0.4rem; }
        #variant .vartab {
            padding: 4px 12px; font-size: 0.8rem;
            border: 1px solid var(--border-color);
        }
        #variant .vartab.active {
            background: var(--ut-black); color: #fff; font-weight: bold;
        }
        #tabs .tab:hover, #subtabs .subtab:hover, #variant .vartab:hover {
            background: var(--ut-red); color: #fff;
        }

        select, input[type="text"] {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            font-family: "Monaco", "Consolas", monospace;
            font-size: 0.95rem;
            background-color: #fafafa;
            color: var(--ut-dark-grey);
            outline: none;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--ut-black);
            background-color: #fff;
        }

        button {
            background-color: var(--ut-black);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background-color: var(--ut-red); }

        #goal {
            font-family: "Monaco", "Consolas", monospace;
            font-size: 1.05rem;
            margin: 0 0 1.2rem 0;
        }
        #goal .goaltitle { font-family: "Arial", sans-serif; }
        #goal .goaleq { margin-left: 0.6rem; }

        #rulesbox {
            background: #f7f7f7;
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.6rem;
            font-family: "Monaco", "Consolas", monospace;
            font-size: 0.85rem;
        }
        #rulesbox .rule { display: flex; gap: 1.2rem; padding: 1px 0; }
        #rulesbox .rulelabel { min-width: 7rem; font-weight: bold; }
        #rulesbox .ruledoc { color: #444; }

        .sec { margin-bottom: 2rem; }

        .seclabel {
            font-weight: bold;
            margin-bottom: 0.4rem;
        }

        .bind {
            font-family: "Monaco", "Consolas", monospace;
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .row {
            display: flex;
            align-items: baseline;
            gap: 1.2rem;
            padding: 4px 0;
            font-family: "Monaco", "Consolas", monospace;
            font-size: 1rem;
        }

        .term { min-width: 16rem; }
        .cite { color: #555; font-size: 0.85rem; min-width: 8rem; }
        .cite select { font-size: 0.85rem; padding: 2px 4px; }
        .st { font-size: 0.85rem; }

        .st.ok    { color: var(--ok); }
        .st.warn  { color: var(--warn); }
        .st.fail  { color: var(--fail); }
        .st.pending { color: #999; }

        .row.ok .term    { color: var(--ok); }
        .row.warn .term  { color: var(--warn); }
        .row.fail .term  { color: var(--fail); }

        input.hole, input.expr { min-width: 9rem; }
        input.expr { min-width: 20rem; }

        #ihrow {
            margin-bottom: 1.5rem;
            font-family: "Monaco", "Consolas", monospace;
        }

        #ihrow input { min-width: 22rem; }

        #checkbar {
            margin-top: 0.5rem;
            border-top: 2px solid var(--ut-black);
            padding-top: 1.2rem;
            display: flex;
            align-items: baseline;
            gap: 1.4rem;
        }

        #summary { font-size: 0.95rem; }

        .hint {
            color: #666;
            font-size: 0.8rem;
            margin-top: 0.6rem;
            font-family: "Arial", sans-serif;
        }

        footer {
            margin-top: 4rem;
            padding: 3rem 10%;
            background-color: #f9f9f9;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: #666;
        }

        .ut-accent { color: var(--ut-red); font-weight: bold; }
    </style>

    <script src="../lib/prepare_util.js" type="module"></script>
    <script type="module">
        import {start_worker} from "../lib/start_worker.js"
        await start_worker([], "html/proof_gui", "html/proof_worker")
    </script>
</head>
<body>

<header>
    <h1>Induction Proofs — Sheet 1</h1>
</header>

<main>
    <div id="tabs"></div>
    <div id="subtabs"></div>
    <div id="variant"></div>

    <div id="goal"></div>
    <div id="rulesbox"></div>
    <div id="ihrow"></div>
    <div id="proof"></div>

    <div id="checkbar">
        <button id="check">Check proof</button>
        <span id="summary"></span>
    </div>

    <div class="hint">
        input: <code>\lambda</code> → λ ·
        concatenation = space or <code>·</code> ·
        <code>w^R</code>, <code>w^(k+1)</code>, <code>w^k</code> ·
        sum: <code>sum(i,0,n;k^i)</code> ·
        <code>f(n)</code>
    </div>
</main>

<footer>
</footer>

</body>
</html>
